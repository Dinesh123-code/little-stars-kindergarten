<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FFC42E'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Little Stars Kindergarten &amp; Preschool</title>
    <meta name="description" content="Official responsive website for Little Stars Kindergarten featuring dynamic programs (Play Group, Nursery, LKG, UKG), online admissions enquiry system, activities, facilities, gallery, and administrative management." />
    <meta property="og:title" content="Little Stars Kindergarten &amp; Preschool" />
    <meta property="og:description" content="A Joyful Start for Little Stars • Dynamic programs, online admissions enquiry system, activities, facilities, and child-centered learning." />
    <!-- Google Fonts: Fredoka (Display) & Nunito (Body) from littlestarskindergarten.online -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <style>
      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 500ms ease-out, visibility 500ms ease-out;
      }
      #preloader.preloader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes starPulse {
        0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
        50% { transform: scale(1.15) rotate(8deg); opacity: 0.85; }
      }
      .preloader-star {
        width: 68px;
        height: 68px;
        background: #FFC42E;
        color: #1F2A66;
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 38px;
        font-weight: 900;
        box-shadow: 0 12px 28px -6px rgba(255, 196, 46, 0.5);
        animation: starPulse 1.2s ease-in-out infinite;
      }
      .preloader-dots span {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #ED2E84;
        margin: 0 3px;
        animation: dotsBounce 1.4s infinite ease-in-out both;
      }
      .preloader-dots span:nth-child(1) { animation-delay: -0.32s; }
      .preloader-dots span:nth-child(2) { animation-delay: -0.16s; }
      @keyframes dotsBounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
      }
    </style>
  </head>
  <body class="font-body bg-white text-ink antialiased selection:bg-brand-pink/20 selection:text-brand-pink">
    <!-- Top Scroll Progress Bar -->
    <div id="scrollProgressBar"></div>
    <!-- Page Preloading Animation Screen -->
    <div id="preloader">
      <div class="preloader-star">★</div>
      <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #1F2A66; margin-top: 18px;">Little Stars</div>
      <div style="font-size: 11px; font-weight: 700; color: #ED2E84; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px;">Kindergarten & Preschool</div>
      <div class="preloader-dots" style="margin-top: 22px;">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
